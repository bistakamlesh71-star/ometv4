<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Question AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:20px;
  font-weight:800;
}

.logoIcon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.newBtn{
  border:0;
  background:#111827;
  color:white;
  padding:10px 14px;
  border-radius:11px;
  font-weight:700;
  cursor:pointer;
}

/* MAIN */

.main{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px 15px 150px;
}

.welcome{
  text-align:center;
  padding:55px 10px 25px;
}

.welcome h1{
  font-size:34px;
  margin:0 0 10px;
}

.welcome p{
  color:#6b7280;
  margin:0;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:25px 0;
}

.subject{
  border:1px solid #e5e7eb;
  background:#fff;
  padding:15px 8px;
  border-radius:15px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.subject:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 20px #0001;
}

.subject span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

/* MESSAGES */

.message{
  display:flex;
  gap:12px;
  margin:22px 0;
  align-items:flex-start;
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.userAvatar{
  background:#2563eb;
}

.aiAvatar{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.messageBody{
  flex:1;
  min-width:0;
}

.messageName{
  font-size:13px;
  color:#6b7280;
  margin-bottom:5px;
  font-weight:700;
}

.messageText{
  white-space:pre-wrap;
  line-height:1.65;
  font-size:16px;
  overflow-wrap:anywhere;
}

.copyBtn{
  margin-top:10px;
  border:1px solid #ddd;
  background:white;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
}

/* TYPING */

.typing{
  display:flex;
  gap:5px;
  padding:10px 0;
}

.dot{
  width:7px;
  height:7px;
  background:#777;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
  }
  30%{
    transform:translateY(-6px);
  }
}

/* INPUT */

.inputArea{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  padding:15px;
  background:linear-gradient(
    transparent,
    #f5f7fb 25%
  );
}

.inputBox{
  max-width:900px;
  margin:auto;
  background:#fff;
  border:1px solid #d9dce3;
  border-radius:18px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 8px 30px #0002;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  font-size:16px;
  padding:11px;
  max-height:140px;
  font-family:inherit;
}

.sendBtn{
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  background:#111827;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.sendBtn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.searchToggle{
  border:0;
  background:#eef2ff;
  color:#4338ca;
  border-radius:10px;
  padding:8px 10px;
  margin:0 5px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.status{
  max-width:900px;
  margin:5px auto 0;
  text-align:center;
  color:#6b7280;
  font-size:11px;
}

/* ERROR */

.error{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
  padding:12px;
  border-radius:12px;
  margin:15px 0;
  line-height:1.5;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:58px;
  }

  .logo{
    font-size:18px;
  }

  .logoIcon{
    width:34px;
    height:34px;
  }

  .newBtn{
    padding:8px 10px;
    font-size:12px;
  }

  .main{
    padding:10px 12px 145px;
  }

  .welcome{
    padding-top:35px;
  }

  .welcome h1{
    font-size:28px;
  }

  .subjects{
    grid-template-columns:repeat(2,1fr);
  }

  .messageText{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

<div class="logo">
  <div class="logoIcon">🤖</div>
  Question AI
</div>

<button
class="newBtn"
onclick="newChat()">
＋ New Chat
</button>

</header>


<!-- MAIN -->

<main
id="main"
class="main">

<div
id="welcome"
class="welcome">

<h1>
Ask Anything 🤖
</h1>

<p>
Hindi • English • Math • Physics • Chemistry • Biology
</p>

<div class="subjects">

<button
class="subject"
onclick="setSubject('Mathematics')">
<span>➗</span>
Math
</button>

<button
class="subject"
onclick="setSubject('Physics')">
<span>⚡</span>
Physics
</button>

<button
class="subject"
onclick="setSubject('Chemistry')">
<span>🧪</span>
Chemistry
</button>

<button
class="subject"
onclick="setSubject('Biology')">
<span>🧬</span>
Biology
</button>

<button
class="subject"
onclick="setSubject('English')">
<span>🇬🇧</span>
English
</button>

<button
class="subject"
onclick="setSubject('Hindi')">
<span>🇮🇳</span>
Hindi
</button>

</div>

</div>

<div id="chat"></div>

</main>


<!-- INPUT -->

<div class="inputArea">

<div class="inputBox">

<textarea
id="question"
rows="1"
placeholder="Ask your question..."
oninput="resizeInput()"
onkeydown="handleKey(event)">
</textarea>

<button
class="searchToggle"
id="searchBtn"
onclick="toggleSearch()">
🔎 Search OFF
</button>

<button
id="sendBtn"
class="sendBtn"
onclick="askAI()">
➤
</button>

</div>

<div
id="status"
class="status">
Gemini AI
</div>

</div>

</div>


<script>

/*
==================================================
GEMINI SETTINGS
==================================================

1. Google AI Studio बाट API key बनाउनुहोस्.
2. तल YOUR_GEMINI_API_KEY मा राख्नुहोस्.

WARNING:
यो demo/testing का लागि हो.
Public website मा API key expose नगर्नुहोस्.
Production मा backend प्रयोग गर्नुहोस्.
==================================================
*/

const API_KEY =
"YOUR_GEMINI_API_KEY";


/*
Current stable model used here.
Google's model availability can change.
*/

const MODEL =
"gemini-2.5-flash";


let selectedSubject =
"General";

let useSearch =
false;

let busy =
false;


/* =========================
SUBJECT
========================= */

function setSubject(subject){

  selectedSubject =
  subject;

  const input =
  document.getElementById("question");

  input.placeholder =
  subject+
  " question लेख्नुहोस्...";

  input.focus();

}


/* =========================
SEARCH TOGGLE
========================= */

function toggleSearch(){

  useSearch =
  !useSearch;

  const btn =
  document.getElementById("searchBtn");

  if(useSearch){

    btn.innerText =
    "🔎 Search ON";

    btn.style.background =
    "#dcfce7";

    btn.style.color =
    "#166534";

  }else{

    btn.innerText =
    "🔎 Search OFF";

    btn.style.background =
    "#eef2ff";

    btn.style.color =
    "#4338ca";

  }

}


/* =========================
ASK AI
========================= */

async function askAI(){

  if(busy)
  return;

  const input =
  document.getElementById("question");

  const question =
  input.value.trim();

  if(!question)
  return;


  if(
    !API_KEY ||
    API_KEY ===
    "YOUR_GEMINI_API_KEY"
  ){

    addError(
      "Gemini API key राखिएको छैन। पहिले API key राख्नुहोस्।"
    );

    return;
  }


  busy=true;

  document
  .getElementById("sendBtn")
  .disabled=true;


  document
  .getElementById("welcome")
  ?.remove();


  addMessage(
    question,
    "user"
  );

  input.value="";

  resizeInput();


  const loadingId =
  showTyping();


  try{

    const answer =
    await callGemini(
      question
    );

    removeTyping(
      loadingId
    );

    addMessage(
      answer,
      "ai"
    );

  }catch(error){

    removeTyping(
      loadingId
    );

    addError(
      error.message
    );

  }


  busy=false;

  document
  .getElementById("sendBtn")
  .disabled=false;

}


/* =========================
GEMINI API
========================= */

async function callGemini(question){

  const url =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  +MODEL+
  ":generateContent?key="
  +encodeURIComponent(API_KEY);


  const systemInstruction = `
You are Question AI, a helpful educational assistant.

You help students solve:
- Mathematics
- Physics
- Chemistry
- Biology
- English
- Hindi
- General academic questions

Current subject:
${selectedSubject}

Rules:
1. Answer in the same language as the user's question when possible.
2. For mathematics and science, show clear step-by-step working.
3. Explain formulas before using them.
4. For chemistry, write chemical equations clearly.
5. For biology, explain concepts simply and accurately.
6. For Hindi and English, correct grammar and explain the answer.
7. If the question is ambiguous, ask a short clarification.
8. Do not invent facts.
9. Keep the explanation student-friendly.
10. Give the final answer clearly at the end.
`;


  const body = {

    system_instruction:{
      parts:[
        {
          text:
          systemInstruction
        }
      ]
    },

    contents:[
      {
        role:"user",
        parts:[
          {
            text:
            question
          }
        ]
      }
    ],

    generationConfig:{
      temperature:0.3,
      maxOutputTokens:4096
    }

  };


  /*
  Search grounding:
  Gemini 2.5 Flash supports Google Search grounding.
  */

  if(useSearch){

    body.tools=[
      {
        google_search:{}
      }
    ];

  }


  const response =
  await fetch(
    url,
    {
      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:
      JSON.stringify(body)
    }
  );


  const data =
  await response.json();


  if(!response.ok){

    let msg =
    "Gemini API error.";

    if(data.error?.message){

      msg =
      data.error.message;

    }

    throw new Error(msg);

  }


  const parts =
  data.candidates?.[0]?.content?.parts
  ||[];


  const text =
  parts
  .map(part=>part.text||"")
  .join("");


  if(!text){

    throw new Error(
      "AI ले कुनै answer दिएन। फेरि try गर्नुहोस्।"
    );

  }


  return text;

}


/* =========================
ADD MESSAGE
========================= */

function addMessage(
  text,
  type
){

  const chat =
  document.getElementById("chat");


  const message =
  document.createElement("div");

  message.className =
  "message";


  const avatar =
  document.createElement("div");

  avatar.className =
  "avatar "+
  (
    type==="user"
    ?"userAvatar"
    :"aiAvatar"
  );

  avatar.innerText =
  type==="user"
  ?"U"
  :"AI";


  const body =
  document.createElement("div");

  body.className =
  "messageBody";


  const name =
  document.createElement("div");

  name.className =
  "messageName";

  name.innerText =
  type==="user"
  ?"You"
  :"Question AI";


  const textBox =
  document.createElement("div");

  textBox.className =
  "messageText";

  textBox.innerText =
  text;


  body.appendChild(name);

  body.appendChild(textBox);


  if(type==="ai"){

    const copy =
    document.createElement("button");

    copy.className =
    "copyBtn";

    copy.innerText =
    "📋 Copy";

    copy.onclick =
    function(){

      navigator.clipboard
      .writeText(text);

      copy.innerText =
      "✓ Copied";

      setTimeout(
        ()=>{
          copy.innerText =
          "📋 Copy";
        },
        1500
      );

    };

    body.appendChild(copy);

  }


  message.appendChild(
    avatar
  );

  message.appendChild(
    body
  );


  chat.appendChild(
    message
  );


  message.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =========================
ERROR
========================= */

function addError(text){

  const chat =
  document.getElementById("chat");

  const div =
  document.createElement("div");

  div.className =
  "error";

  div.innerText =
  "⚠️ "+text;

  chat.appendChild(div);

  div.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
TYPING
========================= */

function showTyping(){

  const id =
  "typing_"+Date.now();

  const chat =
  document.getElementById("chat");


  const message =
  document.createElement("div");

  message.className =
  "message";

  message.id =
  id;


  message.innerHTML = `

    <div class="avatar aiAvatar">
      AI
    </div>

    <div class="messageBody">

      <div class="messageName">
        Question AI
      </div>

      <div class="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

    </div>

  `;


  chat.appendChild(
    message
  );


  message.scrollIntoView({
    behavior:"smooth"
  });


  return id;

}


function removeTyping(id){

  document
  .getElementById(id)
  ?.remove();

}


/* =========================
NEW CHAT
========================= */

function newChat(){

  document
  .getElementById("chat")
  .innerHTML="";


  selectedSubject =
  "General";


  const input =
  document.getElementById("question");

  input.value="";

  input.placeholder =
  "Ask your question...";


  document
  .getElementById("main")
  .scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
TEXTAREA
========================= */

function resizeInput(){

  const input =
  document.getElementById("question");

  input.style.height =
  "auto";

  input.style.height =
  Math.min(
    input.scrollHeight,
    140
  )+"px";

}


/* =========================
ENTER
========================= */

function handleKey(event){

  if(
    event.key==="Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    askAI();

  }

}

</script>

</body>
</html>
