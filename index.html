<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Question Solver</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:20;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.newBtn{
  border:0;
  background:white;
  color:#4f46e5;
  padding:9px 13px;
  border-radius:10px;
  font-weight:bold;
}

main{
  max-width:900px;
  margin:auto;
  padding:15px 15px 160px;
}

/* API BOX */

.apiBox{
  background:white;
  border:1px solid #e5e7eb;
  padding:15px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0001;
}

.apiTitle{
  font-weight:bold;
  margin-bottom:9px;
}

.apiInput{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.apiInput:focus{
  border-color:#4f46e5;
}

.saveKey{
  width:100%;
  margin-top:9px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#4f46e5;
  color:white;
  font-weight:bold;
}

.keyStatus{
  display:block;
  margin-top:8px;
  font-size:12px;
  color:#6b7280;
}

/* HERO */

.hero{
  text-align:center;
  padding:30px 5px 20px;
}

.hero h1{
  font-size:32px;
  margin:5px 0 10px;
}

.hero p{
  color:#6b7280;
}

/* SUBJECTS */

.subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.subject{
  border:1px solid #e5e7eb;
  background:white;
  border-radius:15px;
  padding:15px 5px;
  font-weight:bold;
  cursor:pointer;
}

.subject:hover{
  box-shadow:0 5px 20px #0002;
}

.subject span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

/* CHAT */

.message{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.userAvatar{
  background:#2563eb;
}

.aiAvatar{
  background:#7c3aed;
}

.content{
  flex:1;
  min-width:0;
}

.name{
  color:#6b7280;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.answer{
  white-space:pre-wrap;
  line-height:1.65;
  overflow-wrap:anywhere;
}

.copyBtn{
  margin-top:9px;
  padding:7px 10px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
}

/* LOADING */

.loading{
  display:flex;
  gap:5px;
  padding:10px 0;
}

.dot{
  width:7px;
  height:7px;
  background:#777;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
  }
  30%{
    transform:translateY(-6px);
  }
}

/* ERROR */

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  line-height:1.5;
}

/* INPUT */

.inputArea{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:#f5f7fb;
  padding:10px;
}

.inputBox{
  max-width:900px;
  margin:auto;
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  padding:8px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  box-shadow:0 5px 25px #0002;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  font-size:16px;
  padding:10px;
  max-height:130px;
  font-family:Arial;
}

.photoBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:11px;
  background:#eef2ff;
  font-size:20px;
}

.sendBtn{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:#4f46e5;
  color:white;
  font-size:19px;
}

.sendBtn:disabled{
  opacity:.5;
}

#imageInput{
  display:none;
}

.preview{
  display:none;
  max-width:100px;
  max-height:100px;
  border-radius:10px;
  margin:5px auto;
}

.status{
  text-align:center;
  font-size:11px;
  color:#777;
  margin-top:4px;
}

/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:18px;
  }

  .subjects{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:27px;
  }

  main{
    padding-left:10px;
    padding-right:10px;
  }

}
</style>
</head>


<body>

<header>

  <div class="header">

    <div class="logo">
      🤖 AI Question Solver
    </div>

    <button
      class="newBtn"
      onclick="newChat()">
      ＋ New
    </button>

  </div>

</header>


<main>


<!-- API KEY BOX -->

<div class="apiBox">

  <div class="apiTitle">
    🔑 Gemini API Key
  </div>

  <input
    id="apiKeyInput"
    class="apiInput"
    type="password"
    placeholder="Paste your Gemini API key here"
  >

  <button
    class="saveKey"
    onclick="saveApiKey()">
    Save API Key
  </button>

  <small
    id="keyStatus"
    class="keyStatus">
    API key यहाँ paste गर्नुहोस्।
  </small>

</div>


<!-- HERO -->

<div
  id="hero"
  class="hero">

  <h1>
    Ask Anything 🤖
  </h1>

  <p>
    Math • Physics • Chemistry • Biology • English • Hindi • Nepali
  </p>


  <div class="subjects">

    <button
      class="subject"
      onclick="chooseSubject('Mathematics')">

      <span>➗</span>
      Math

    </button>


    <button
      class="subject"
      onclick="chooseSubject('Physics')">

      <span>⚡</span>
      Physics

    </button>


    <button
      class="subject"
      onclick="chooseSubject('Chemistry')">

      <span>🧪</span>
      Chemistry

    </button>


    <button
      class="subject"
      onclick="chooseSubject('Biology')">

      <span>🧬</span>
      Biology

    </button>


    <button
      class="subject"
      onclick="chooseSubject('English')">

      <span>🇬🇧</span>
      English

    </button>


    <button
      class="subject"
      onclick="chooseSubject('Hindi')">

      <span>🇮🇳</span>
      Hindi

    </button>

  </div>

</div>


<!-- CHAT -->

<div id="chat"></div>


</main>


<!-- INPUT -->

<div class="inputArea">

  <div class="inputBox">


    <input
      id="imageInput"
      type="file"
      accept="image/*"
      onchange="selectImage(event)"
    >


    <button
      class="photoBtn"
      onclick="document.getElementById('imageInput').click()">
      📷
    </button>


    <textarea
      id="question"
      rows="1"
      placeholder="Write your question..."
      onkeydown="handleEnter(event)"
    ></textarea>


    <button
      id="sendBtn"
      class="sendBtn"
      onclick="solveQuestion()">
      ➤
    </button>

  </div>


  <img
    id="preview"
    class="preview"
  >


  <div
    id="status"
    class="status">
    Gemini AI • Ready
  </div>

</div>


<script>


/* ==================================================
   API KEY
   ================================================== */

let API_KEY =
  localStorage.getItem("gemini_api_key") || "";


/* Gemini model */

const MODEL =
  "gemini-2.5-flash";


let subject =
  "General";


let selectedImage =
  null;


let selectedMime =
  null;


let busy =
  false;


/* ==================================================
   CHECK SAVED KEY
   ================================================== */

if(API_KEY){

  document.getElementById("keyStatus")
    .textContent =
    "✅ API key saved on this device.";

}


/* ==================================================
   SAVE API KEY
   ================================================== */

function saveApiKey(){

  const input =
    document.getElementById("apiKeyInput");

  const key =
    input.value.trim();


  if(!key){

    alert(
      "पहिले Gemini API key paste गर्नुहोस्।"
    );

    return;

  }


  API_KEY =
    key;


  localStorage.setItem(
    "gemini_api_key",
    key
  );


  input.value = "";


  document.getElementById("keyStatus")
    .textContent =
    "✅ API key saved successfully.";

}


/* ==================================================
   SUBJECT
   ================================================== */

function chooseSubject(name){

  subject =
    name;


  document.getElementById("question")
    .placeholder =
    name +
    " question लेख्नुहोस्...";


  document.getElementById("question")
    .focus();

}


/* ==================================================
   IMAGE
   ================================================== */

function selectImage(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  if(file.size > 8 * 1024 * 1024){

    alert(
      "Image 8MB भन्दा सानो राख्नुहोस्।"
    );

    return;

  }


  selectedMime =
    file.type;


  const reader =
    new FileReader();


  reader.onload =
    function(){

      const result =
        reader.result;


      selectedImage =
        result.split(",")[1];


      const preview =
        document.getElementById("preview");


      preview.src =
        result;


      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* ==================================================
   SOLVE QUESTION
   ================================================== */

async function solveQuestion(){

  if(busy)
    return;


  const input =
    document.getElementById("question");


  const question =
    input.value.trim();


  if(!question && !selectedImage){

    alert(
      "Question लेख्नुहोस् वा 📷 photo upload गर्नुहोस्।"
    );

    return;

  }


  if(!API_KEY){

    showError(
      "पहिले माथिको 🔑 Gemini API Key box मा API key paste गरेर Save API Key थिच्नुहोस्।"
    );

    return;

  }


  busy =
    true;


  document.getElementById("sendBtn")
    .disabled =
    true;


  document.getElementById("hero")
    ?.remove();


  const userQuestion =
    question ||
    "यो photo मा भएको question solve गर्नुहोस्।";


  addMessage(
    userQuestion,
    "user"
  );


  input.value =
    "";


  input.style.height =
    "auto";


  const loading =
    showLoading();


  try{

    const answer =
      await askGemini(
        userQuestion
      );


    loading.remove();


    addMessage(
      answer,
      "ai"
    );


  }
  catch(error){

    loading.remove();


    showError(
      error.message
    );

  }


  busy =
    false;


  document.getElementById("sendBtn")
    .disabled =
    false;

}


/* ==================================================
   GEMINI API
   ================================================== */

async function askGemini(question){

  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/"
    + MODEL +
    ":generateContent?key=" +
    encodeURIComponent(API_KEY);


  const instruction = `

You are an expert AI Question Solver and personal tutor.

Subject:
${subject}

Question:
${question}

Solve the question accurately.

Rules:

1. Answer in the same language as the user.
2. If the user uses Nepali, answer in Nepali.
3. If the user uses Hindi, answer in Hindi.
4. If the user uses English, answer in English.
5. Mathematics: show step-by-step calculation.
6. Physics: show formula, values, calculation and final answer.
7. Chemistry: explain reactions and equations clearly.
8. Biology: explain concepts simply.
9. English/Hindi: explain grammar and corrections.
10. If an image is provided, read the question from it.
11. Do not invent facts.
12. Make explanations easy for students.
13. Clearly show the final answer.

`;


  const parts = [

    {
      text:
      instruction
    }

  ];


  if(selectedImage){

    parts.push({

      inlineData:{
        mimeType:
          selectedMime,

        data:
          selectedImage
      }

    });

  }


  const body = {

    contents:[
      {
        role:"user",

        parts:
          parts
      }
    ],

    generationConfig:{

      temperature:
        0.2,

      maxOutputTokens:
        4096

    }

  };


  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)

      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Gemini API error."
    );

  }


  const answer =
    data.candidates?.[0]
      ?.content?.parts
      ?.map(
        x => x.text || ""
      )
      .join("");


  if(!answer){

    throw new Error(
      "AI ले answer दिएन। फेरि try गर्नुहोस्।"
    );

  }


  return answer;

}


/* ==================================================
   MESSAGE
   ================================================== */

function addMessage(
  text,
  type
){

  const chat =
    document.getElementById("chat");


  const message =
    document.createElement("div");


  message.className =
    "message";


  const avatar =
    document.createElement("div");


  avatar.className =
    "avatar " +
    (
      type === "user"
      ? "userAvatar"
      : "aiAvatar"
    );


  avatar.textContent =
    type === "user"
    ? "U"
    : "AI";


  const content =
    document.createElement("div");


  content.className =
    "content";


  const name =
    document.createElement("div");


  name.className =
    "name";


  name.textContent =
    type === "user"
    ? "You"
    : "AI Question Solver";


  const answer =
    document.createElement("div");


  answer.className =
    "answer";


  answer.textContent =
    text;


  content.appendChild(
    name
  );


  content.appendChild(
    answer
  );


  if(type === "ai"){

    const copy =
      document.createElement(
        "button"
      );


    copy.className =
      "copyBtn";


    copy.textContent =
      "📋 Copy";


    copy.onclick =
      async function(){

        await navigator.clipboard
          .writeText(text);


        copy.textContent =
          "✓ Copied";


        setTimeout(
          function(){

            copy.textContent =
              "📋 Copy";

          },
          1500
        );

      };


    content.appendChild(
      copy
    );

  }


  message.appendChild(
    avatar
  );


  message.appendChild(
    content
  );


  chat.appendChild(
    message
  );


  message.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* ==================================================
   LOADING
   ================================================== */

function showLoading(){

  const chat =
    document.getElementById("chat");


  const message =
    document.createElement("div");


  message.className =
    "message";


  message.innerHTML = `

    <div class="avatar aiAvatar">
      AI
    </div>

    <div class="content">

      <div class="name">
        AI Question Solver
      </div>

      <div class="loading">

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

      </div>

    </div>

  `;


  chat.appendChild(
    message
  );


  message.scrollIntoView({
    behavior:"smooth"
  });


  return message;

}


/* ==================================================
   ERROR
   ================================================== */

function showError(message){

  const chat =
    document.getElementById("chat");


  const error =
    document.createElement("div");


  error.className =
    "error";


  error.textContent =
    "⚠️ " + message;


  chat.appendChild(
    error
  );


  error.scrollIntoView({
    behavior:"smooth"
  });

}


/* ==================================================
   NEW CHAT
   ================================================== */

function newChat(){

  document.getElementById("chat")
    .innerHTML = "";


  subject =
    "General";


  selectedImage =
    null;


  selectedMime =
    null;


  document.getElementById("question")
    .value = "";


  document.getElementById("preview")
    .style.display = "none";


  document.getElementById("imageInput")
    .value = "";

}


/* ==================================================
   ENTER TO SEND
   ================================================== */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    solveQuestion();

  }

}

</script>

</body>
</html>
