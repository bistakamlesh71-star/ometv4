<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    select {
      background: #1b1b1b;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: #ff1744;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin: 20px 0;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .buttons button {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Video Generator</h1>

    <textarea
      id="script"
      placeholder="Write your video script here..."
    ></textarea>

    <select id="aspectRatio">
      <option value="9:16">9:16 - TikTok / Shorts / Reels</option>
      <option value="16:9">16:9 - YouTube</option>
      <option value="1:1">1:1 - Square</option>
    </select>

    <button id="generateBtn" onclick="generateVideo()">
      Generate AI Video
    </button>

    <div id="status"></div>

    <video id="videoPlayer" controls style="display:none;"></video>

    <div class="buttons" id="videoButtons" style="display:none;">
      <button onclick="downloadVideo()">⬇️ Download</button>
      <button onclick="shareVideo()">📤 Share</button>
    </div>

  </div>

<script>

const BACKEND_URL = "https://ometv4.onrender.com";

let generatedVideoUrl = "";

async function generateVideo() {

  const script = document.getElementById("script").value.trim();
  const aspectRatio = document.getElementById("aspectRatio").value;

  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const player = document.getElementById("videoPlayer");
  const videoButtons = document.getElementById("videoButtons");

  if (!script) {
    status.innerText = "Please enter a script first.";
    return;
  }

  button.disabled = true;
  button.innerText = "Generating...";
  status.innerText = "🎬 AI video is being generated...";
  player.style.display = "none";
  videoButtons.style.display = "none";

  try {

    const response = await fetch(
      `${BACKEND_URL}/api/generate-video`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          script: script,
          aspectRatio: aspectRatio
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Video generation failed");
    }

    generatedVideoUrl = data.videoUrl.startsWith("http")
      ? data.videoUrl
      : `${BACKEND_URL}${data.videoUrl}`;

    player.src = generatedVideoUrl;
    player.style.display = "block";
    videoButtons.style.display = "grid";

    status.innerText = "✅ Video generated successfully!";

  } catch (error) {

    console.error(error);

    status.innerText = "❌ Error: " + error.message;

  } finally {

    button.disabled = false;
    button.innerText = "Generate AI Video";

  }
}


function downloadVideo() {

  if (!generatedVideoUrl) return;

  const link = document.createElement("a");

  link.href = generatedVideoUrl;
  link.download = "ai-video.mp4";

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}


async function shareVideo() {

  if (!generatedVideoUrl) return;

  if (navigator.share) {

    try {

      await navigator.share({
        title: "AI Generated Video",
        text: "Check out my AI generated video!",
        url: generatedVideoUrl
      });

    } catch (error) {
      console.log("Share cancelled");
    }

  } else {

    await navigator.clipboard.writeText(generatedVideoUrl);

    alert("Video link copied!");

  }
}

</script>

</body>
</html>
