<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FF Top Up</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#111827,#7c2d12);
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:#ffffff18;
backdrop-filter:blur(12px);
border-radius:25px;
padding:22px;
box-shadow:0 10px 40px #0008;
}

h1{
text-align:center;
font-size:32px;
}

.subtitle{
text-align:center;
opacity:.8;
}

.payment-box{
background:#0005;
padding:18px;
border-radius:18px;
margin:15px 0;
text-align:center;
}

.esewa{
color:#58d68d;
font-size:22px;
font-weight:bold;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
}

input,select{
width:100%;
padding:14px;
border:0;
border-radius:12px;
font-size:16px;
outline:none;
}

.packages{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.package{
background:#ffffff18;
border:2px solid transparent;
padding:15px;
border-radius:15px;
text-align:center;
cursor:pointer;
}

.package:hover{
border-color:#facc15;
}

.package b{
display:block;
font-size:20px;
margin-bottom:5px;
}

button{
width:100%;
padding:15px;
margin-top:18px;
border:0;
border-radius:14px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.whatsapp{
background:#25D366;
color:white;
}

.support{
background:#2563eb;
color:white;
}

.copy{
background:#facc15;
color:#111;
}

.note{
font-size:13px;
opacity:.75;
text-align:center;
margin-top:15px;
}

.success{
display:none;
background:#16a34a;
padding:12px;
border-radius:12px;
margin-top:15px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 FF TOP UP 💎</h1>

<p class="subtitle">
Fast & Easy Free Fire Top Up
</p>

<div class="payment-box">

<div>💳 Payment Method</div>

<div class="esewa">
eSewa
</div>

<div>
📱 9761996391
</div>

<button class="copy" onclick="copyEsewa()">
📋 COPY eSewa NUMBER
</button>

</div>

<label>Free Fire UID</label>

<input
id="uid"
type="number"
placeholder="Enter your FF UID"
>

<label>Diamond Package</label>

<div class="packages">

<div class="package"
onclick="selectPackage('100 Diamonds - Rs 150')">
<b>💎 100</b>
Rs. 150
</div>

<div class="package"
onclick="selectPackage('310 Diamonds - Rs 450')">
<b>💎 310</b>
Rs. 450
</div>

<div class="package"
onclick="selectPackage('520 Diamonds - Rs 750')">
<b>💎 520</b>
Rs. 750
</div>

<div class="package"
onclick="selectPackage('1060 Diamonds - Rs 1500')">
<b>💎 1060</b>
Rs. 1500
</div>

</div>

<input
id="package"
type="text"
placeholder="Select a package"
readonly
>

<label>Payment Method</label>

<select id="payment">

<option value="">
Select payment method
</option>

<option value="eSewa">
eSewa
</option>

</select>

<label>Transaction ID</label>

<input
id="transaction"
type="text"
placeholder="Enter payment transaction ID"
>

<div
id="success"
class="success">
Order ready! WhatsApp खोलिँदैछ...
</div>

<button
class="whatsapp"
onclick="sendOrder()">

📲 SEND ORDER ON WHATSAPP

</button>

<button
class="support"
onclick="support()">

💬 WHATSAPP SUPPORT

</button>

<p class="note">
पहिले eSewa मा payment गर्नुहोस्। त्यसपछि Transaction ID राखेर order पठाउनुहोस्।
</p>

</div>

<script>

const WHATSAPP_NUMBER =
"9779761996391";

const ESEWA_NUMBER =
"9761996391";


function selectPackage(pkg){

document.getElementById("package").value=pkg;

}


function copyEsewa(){

navigator.clipboard.writeText(ESEWA_NUMBER);

alert("eSewa नम्बर copied: "+ESEWA_NUMBER);

}


function sendOrder(){

const uid=
document.getElementById("uid").value.trim();

const pkg=
document.getElementById("package").value;

const payment=
document.getElementById("payment").value;

const transaction=
document.getElementById("transaction").value.trim();


if(!uid){

alert("कृपया Free Fire UID राख्नुहोस्।");

return;

}


if(!pkg){

alert("कृपया Diamond Package छान्नुहोस्।");

return;

}


if(!payment){

alert("कृपया Payment Method छान्नुहोस्।");

return;

}


if(!transaction){

alert("कृपया Transaction ID राख्नुहोस्।");

return;

}


const message=
`🔥 FF TOP UP ORDER

🎮 Free Fire UID:
${uid}

💎 Package:
${pkg}

💰 Payment:
${payment}

🧾 Transaction ID:
${transaction}

💳 eSewa Number:
9761996391

Please verify my payment and process my order.`;


const url=
"https://wa.me/"+
WHATSAPP_NUMBER+
"?text="+
encodeURIComponent(message);


document.getElementById("success")
.style.display="block";


window.open(url,"_blank");

}


function support(){

const message=
"Hello, I need help with Free Fire Top Up.";

const url=
"https://wa.me/"+
WHATSAPP_NUMBER+
"?text="+
encodeURIComponent(message);

window.open(url,"_blank");

}

</script>

</body>
</html>
