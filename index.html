<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>My AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f8;
color:#222;
height:100vh;
overflow:hidden;
}

.app{
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
height:60px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-weight:bold;
}

.logo{
font-size:21px;
}

.newchat{
background:#111;
color:white;
border:0;
border-radius:10px;
padding:9px 12px;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:20px 15px 120px;
}

.welcome{
text-align:center;
margin-top:25vh;
}

.welcome h1{
font-size:30px;
}

.welcome p{
color:#777;
}

/* MESSAGE */

.message{
max-width:850px;
margin:0 auto 18px;
display:flex;
gap:10px;
}

.avatar{
width:34px;
height:34px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#111;
color:#fff;
flex-shrink:0;
}

.user .avatar{
background:#2563eb;
}

.text{
line-height:1.55;
padding-top:5px;
white-space:pre-wrap;
}

/* INPUT */

.inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
background:linear-gradient(
transparent,
#f7f7f8 30%
);
padding:25px 15px 15px;
}

.inputBox{
max-width:850px;
margin:auto;
background:white;
border:1px solid #ccc;
border-radius:18px;
display:flex;
align-items:end;
padding:8px;
box-shadow:0 2px 10px #0001;
}

textarea{
flex:1;
border:0;
outline:0;
resize:none;
font-size:16px;
padding:10px;
max-height:120px;
font-family:inherit;
}

.send{
width:42px;
height:42px;
border:0;
border-radius:12px;
background:#111;
color:white;
font-size:19px;
}

.send:disabled{
opacity:.4;
}

.note{
text-align:center;
font-size:11px;
color:#888;
margin-top:7px;
}

/* MOBILE */

@media(max-width:600px){

.chat{
padding-left:12px;
padding-right:12px;
}

.message{
font-size:15px;
}

.logo{
font-size:19px;
}

}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<div class="logo">
🤖 My AI
</div>

<button
class="newchat"
onclick="newChat()">
＋ New Chat
</button>

</div>


<!-- CHAT -->

<div
id="chat"
class="chat">

<div
id="welcome"
class="welcome">

<h1>
👋 Hello!
</h1>

<p>
Ask me anything.
</p>

</div>

</div>


<!-- INPUT -->

<div class="inputArea">

<div class="inputBox">

<textarea
id="input"
rows="1"
placeholder="Message My AI..."
onkeydown="handleKey(event)"
></textarea>

<button
id="send"
class="send"
onclick="sendMessage()">
➤
</button>

</div>

<div class="note">
My AI can make mistakes. Check important information.
</div>

</div>

</div>


<script>

const input=
document.getElementById("input");

const chat=
document.getElementById("chat");

const send=
document.getElementById("send");


/* =====================
SEND MESSAGE
===================== */

function sendMessage(){

const text=
input.value.trim();

if(!text)return;

document
.getElementById("welcome")
?.remove();


addMessage(
text,
"user"
);

input.value="";

send.disabled=true;


/*
DEMO AI RESPONSE

यो ठाउँमा पछि वास्तविक
AI API जोडिनेछ।
*/

setTimeout(()=>{

const answer=
getDemoAnswer(text);

addMessage(
answer,
"ai"
);

send.disabled=false;

},700);

}


/* =====================
ADD MESSAGE
===================== */

function addMessage(
text,
type
){

const message=
document.createElement("div");

message.className=
"message "+type;

const avatar=
document.createElement("div");

avatar.className=
"avatar";

avatar.innerText=
type==="user"
?"U"
:"AI";

const content=
document.createElement("div");

content.className=
"text";

content.innerText=
text;

message.appendChild(avatar);

message.appendChild(content);

chat.appendChild(message);

chat.scrollTop=
chat.scrollHeight;

}


/* =====================
DEMO AI
===================== */

function getDemoAnswer(text){

const t=
text.toLowerCase();

if(
t.includes("hello") ||
t.includes("hi") ||
t.includes("namaste")
){

return "Namaste! 👋 Ma My AI ho. Tapai lai ke help chahinchha?";

}

if(
t.includes("code")
){

return "Sure! 💻 Ma tapai lai HTML, CSS, JavaScript ra app development ko code ma help garna sakchhu.";

}

if(
t.includes("who are you")
){

return "Ma tapai ko AI assistant ho. 🤖";

}

return "Demo mode ma yo response dekhाइएको छ. वास्तविक AI जोड्न backend/API आवश्यक हुन्छ। तपाईंको प्रश्न: "+text;

}


/* =====================
ENTER KEY
===================== */

function handleKey(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}


/* =====================
NEW CHAT
===================== */

function newChat(){

chat.innerHTML=`

<div
id="welcome"
class="welcome">

<h1>
👋 Hello!
</h1>

<p>
Ask me anything.
</p>

</div>

`;

input.value="";

input.focus();

}

</script>

</body>
</html>
