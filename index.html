<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OmeTV 4</title>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#111827,#4f46e5);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
width:94%;
max-width:520px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
border-radius:25px;
padding:22px;
text-align:center;
box-shadow:0 10px 40px #0006;
}

h1{font-size:36px;margin:5px}

button,select{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:14px;
font-size:17px;
font-weight:bold;
}

button{cursor:pointer}

.google{background:white;color:#222}
.start{background:#22c55e;color:white}
.next{background:#3b82f6;color:white}
.stop{background:#ef4444;color:white}
.report{background:#f59e0b;color:white}

video{
width:100%;
height:280px;
object-fit:cover;
background:#000;
border-radius:18px;
margin:10px 0;
}

.hidden{display:none}

.status{
padding:12px;
background:#0004;
border-radius:12px;
margin:10px 0;
}

.small{
font-size:13px;
opacity:.8;
}
</style>
</head>

<body>

<div class="box">

<div id="loginPage">

<h1>OmeTV 4</h1>
<p>Random Video Chat 🌎</p>

<button class="google" onclick="googleLogin()">
🔵 Continue with Google
</button>

<div id="loginStatus" class="status">
Please login
</div>

</div>


<div id="homePage" class="hidden">

<h1>OmeTV 4</h1>

<p id="userInfo"></p>

<select id="country">
<option value="all">🌎 All Countries</option>
<option value="Nepal">🇳🇵 Nepal</option>
<option value="India">🇮🇳 India</option>
<option value="USA">🇺🇸 USA</option>
<option value="UK">🇬🇧 UK</option>
<option value="Japan">🇯🇵 Japan</option>
<option value="Korea">🇰🇷 Korea</option>
</select>

<button class="start" onclick="startChat()">
🎥 START
</button>

<button class="stop" onclick="logout()">
🚪 Logout
</button>

</div>


<div id="chatPage" class="hidden">

<h2>Video Chat 🎥</h2>

<video id="remoteVideo" autoplay playsinline></video>

<video id="localVideo" autoplay playsinline muted></video>

<div id="status" class="status">
Starting...
</div>

<button class="next" onclick="nextPerson()">
➡️ NEXT
</button>

<button class="stop" onclick="stopChat()">
⛔ STOP
</button>

<button class="report" onclick="reportUser()">
🚨 REPORT
</button>

<p class="small">
Your camera preview is shown below the other person.
</p>

</div>

</div>


<script>

const firebaseConfig = {
apiKey:"AIzaSyDX18nNNVbSd3jwdODlh_-XhuFrn2lQEAQ",
authDomain:"ome-tv-4-5fd7b.firebaseapp.com",
projectId:"ome-tv-4-5fd7b",
storageBucket:"ome-tv-4-5fd7b.firebasestorage.app",
messagingSenderId:"827380900936",
appId:"1:827380900936:web:62a7f50dd008c94149a47d",
measurementId:"G-Q82KTMQ43C"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let currentUser=null;
let localStream=null;
let peer=null;
let currentMatch=null;
let searching=false;


async function googleLogin(){

document.getElementById("loginStatus").innerText=
"Opening Google Login...";

try{

const provider=new firebase.auth.GoogleAuthProvider();

await auth.signInWithPopup(provider);

}catch(error){

console.error(error);

document.getElementById("loginStatus").innerText=
"Login failed: "+error.message;

}

}


auth.onAuthStateChanged(user=>{

if(user){

currentUser=user;

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("homePage")
.classList.remove("hidden");

document.getElementById("userInfo").innerText=
"👤 "+(user.displayName||user.email);

}else{

currentUser=null;

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("chatPage")
.classList.add("hidden");

}

});


async function startChat(){

if(!currentUser)return;

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("chatPage")
.classList.remove("hidden");

document.getElementById("status").innerText=
"Requesting camera and microphone...";

try{

localStream=
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("localVideo").srcObject=
localStream;

document.getElementById("status").innerText=
"🔎 Searching for another person...";

searching=true;

await findPerson();

}catch(error){

console.error(error);

document.getElementById("status").innerText=
"Camera/Microphone permission denied.";

}

}


async function findPerson(){

if(!searching)return;

const myCountry=
document.getElementById("country").value;

const waitingRef=db.ref("waiting");

const snapshot=
await waitingRef.once("value");

let found=null;

snapshot.forEach(child=>{

if(child.key!==currentUser.uid){

const data=child.val();

if(
myCountry==="all" ||
data.country==="all" ||
data.country===myCountry
){

found={
uid:child.key,
country:data.country
};

}

}

});


if(found){

const ids=[
currentUser.uid,
found.uid
].sort();

const matchId=ids[0]+"_"+ids[1];

currentMatch=matchId;

await db.ref("matches/"+matchId).update({

user1:ids[0],
user2:ids[1],
createdAt:firebase.database.ServerValue.TIMESTAMP

});

await db.ref("waiting/"+found.uid).remove();

await db.ref("waiting/"+currentUser.uid).remove();

if(currentUser.uid===ids[0]){

await createOffer(matchId);

}else{

await waitForOffer(matchId);

}

}else{

await db.ref("waiting/"+currentUser.uid).set({

country:myCountry,

name:currentUser.displayName||"User",

timestamp:firebase.database.ServerValue.TIMESTAMP

});

db.ref("waiting/"+currentUser.uid)
.onDisconnect()
.remove();

document.getElementById("status").innerText=
"🟢 Waiting for another online user...";

}

}


function createPeer(matchId){

peer=new RTCPeerConnection({

iceServers:[
{
urls:"stun:stun.l.google.com:19302"
},
{
urls:"stun:stun1.l.google.com:19302"
}
]

});


localStream.getTracks().forEach(track=>{

peer.addTrack(track,localStream);

});


peer.ontrack=event=>{

document.getElementById("remoteVideo").srcObject=
event.streams[0];

document.getElementById("status").innerText=
"🟢 Connected!";

};


peer.onicecandidate=event=>{

if(event.candidate){

const path=
"matches/"+matchId+"/candidates/"+
(currentUser.uid);

db.ref(path).push(event.candidate.toJSON());

}

};

}


async function createOffer(matchId){

createPeer(matchId);

const offer=
await peer.createOffer();

await peer.setLocalDescription(offer);

await db.ref("matches/"+matchId+"/offer")
.set({

type:offer.type,
sdp:offer.sdp

});


db.ref("matches/"+matchId+"/answer")
.on("value",async snap=>{

const answer=snap.val();

if(answer && !peer.currentRemoteDescription){

await peer.setRemoteDescription(
new RTCSessionDescription(answer)
);

}

});

listenCandidates(matchId);

document.getElementById("status").innerText=
"📞 Calling another user...";

}


function waitForOffer(matchId){

db.ref("matches/"+matchId+"/offer")
.on("value",async snap=>{

const offer=snap.val();

if(!offer)return;

if(!peer){

createPeer(matchId);

await peer.setRemoteDescription(
new RTCSessionDescription(offer)
);

const answer=
await peer.createAnswer();

await peer.setLocalDescription(answer);

await db.ref("matches/"+matchId+"/answer")
.set({

type:answer.type,
sdp:answer.sdp

});

listenCandidates(matchId);

document.getElementById("status").innerText=
"📞 Connecting...";

}

});

}


function listenCandidates(matchId){

const myPath=
"matches/"+matchId+"/candidates/";

const otherUid=
currentMatch.split("_")
.find(id=>id!==currentUser.uid);

if(!otherUid)return;

const ref=
db.ref(myPath+otherUid);

ref.on("child_added",async snap=>{

try{

if(peer){

await peer.addIceCandidate(
new RTCIceCandidate(snap.val())
);

}

}catch(error){

console.log(error);

}

});

}


async function nextPerson(){

document.getElementById("status").innerText=
"➡️ Finding next person...";

await cleanupMatch();

try{

localStream=
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

document.getElementById("localVideo").srcObject=
localStream;

searching=true;

await findPerson();

}catch(error){

document.getElementById("status").innerText=
"Camera permission required.";

}

}


async function stopChat(){

await cleanupMatch();

document.getElementById("chatPage")
.classList.add("hidden");

document.getElementById("homePage")
.classList.remove("hidden");

}


async function cleanupMatch(){

searching=false;

if(peer){

peer.close();

peer=null;

}

if(currentMatch){

await db.ref(
"matches/"+currentMatch
).remove();

currentMatch=null;

}

if(currentUser){

await db.ref(
"waiting/"+currentUser.uid
).remove();

}

if(localStream){

localStream.getTracks()
.forEach(track=>track.stop());

localStream=null;

}

document.getElementById("localVideo")
.srcObject=null;

document.getElementById("remoteVideo")
.srcObject=null;

}


async function reportUser(){

if(!currentUser)return;

await db.ref("reports").push({

reporter:currentUser.uid,

match:currentMatch||"unknown",

time:firebase.database.ServerValue.TIMESTAMP

});

alert("🚨 Report submitted.");

}


async function logout(){

await stopChat();

await auth.signOut();

}

</script>

</body>
</html>
