<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Question Solver</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.new{
  background:white;
  color:#4f46e5;
  border:0;
  padding:9px 13px;
  border-radius:10px;
  font-weight:bold;
}

main{
  max-width:900px;
  margin:auto;
  padding:25px 15px 150px;
}

.hero{
  text-align:center;
  padding:25px 5px;
}

.hero h1{
  font-size:32px;
  margin:5px;
}

.hero p{
  color:#6b7280;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.subject{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:15px 5px;
  font-weight:bold;
  cursor:pointer;
}

.subject:hover{
  box-shadow:0 5px 20px #0002;
}

.icon{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.message{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.user{
  background:#2563eb;
}

.ai{
  background:#7c3aed;
}

.content{
  flex:1;
}

.name{
  color:#6b7280;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.text{
  white-space:pre-wrap;
  line-height:1.65;
  overflow-wrap:anywhere;
}

.copy{
  margin-top:8px;
  padding:7px 10px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
}

.inputArea{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#f5f7fb;
  padding:10px;
  z-index:20;
}

.inputBox{
  max-width:900px;
  margin:auto;
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  padding:8px;
  display:flex;
  align-items:flex-end;
  gap:5px;
  box-shadow:0 5px 25px #0002;
}

textarea{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  font-size:16px;
  padding:10px;
  font-family:Arial;
  max-height:130px;
}

button{
  cursor:pointer;
}

.send{
  width:45px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#4f46e5;
  color:white;
  font-size:20px;
}

.photo{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#eef2ff;
  font-size:20px;
}

#imageInput{
  display:none;
}

.preview{
  max-width:100px;
  max-height:100px;
  border-radius:10px;
  margin:5px;
  display:none;
}

.status{
  text-align:center;
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.loading{
  display:flex;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;
  background:#777;
  border-radius:50%;
  animation:b 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes b{
  50%{transform:translateY(-6px)}
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}

@media(max-width:600px){
  .subjects{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🤖 AI Question Solver</div>
    <button class="new" onclick="newChat()">＋ New</button>
  </div>
</header>

<main>

<div id="hero" class="hero">
  <h1>Ask Anything 🤖</h1>
  <p>Math • Physics • Chemistry • Biology • English • Hindi • Nepali</p>

  <div class="subjects">

    <button class="subject" onclick="choose('Mathematics')">
      <span class="icon">➗</span>Math
    </button>

    <button class="subject" onclick="choose('Physics')">
      <span class="icon">⚡</span>Physics
    </button>

    <button class="subject" onclick="choose('Chemistry')">
      <span class="icon">🧪</span>Chemistry
    </button>

    <button class="subject" onclick="choose('Biology')">
      <span class="icon">🧬</span>Biology
    </button>

    <button class="subject" onclick="choose('English')">
      <span class="icon">🇬🇧</span>English
    </button>

    <button class="subject" onclick="choose('Hindi')">
      <span class="icon">🇮🇳</span>Hindi
    </button>

  </div>
</div>

<div id="chat"></div>

</main>

<div class="inputArea">

  <div class="inputBox">

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      onchange="selectImage(event)"
    >

    <button
      class="photo"
      onclick="document.getElementById('imageInput').click()">
      📷
    </button>

    <textarea
      id="question"
      rows="1"
      placeholder="Write your question..."
      onkeydown="enterSend(event)"
    ></textarea>

    <button
      class="send"
      id="send"
      onclick="solve()">
      ➤
    </button>

  </div>

  <img id="preview" class="preview">

  <div class="status" id="status">
    Gemini AI • Ready
  </div>

</div>


<script>

/* ==================================================
   🔑 PUT YOUR GEMINI API KEY HERE
   ================================================== */

const API_KEY = "YOUR_GEMINI_API_KEY";


/* Gemini model */

const MODEL = "gemini-2.5-flash";


let subject = "General";

let selectedImage = null;

let selectedMime = null;

let busy = false;


/* ==================================================
   SUBJECT
   ================================================== */

function choose(name){

  subject = name;

  document.getElementById("question").placeholder =
    name + " question लेख्नुहोस्...";

  document.getElementById("question").focus();

}


/* ==================================================
   IMAGE
   ================================================== */

function selectImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  if(file.size > 8 * 1024 * 1024){

    alert("Image 8MB भन्दा सानो राख्नुहोस्।");

    return;

  }

  selectedMime = file.type;

  const reader = new FileReader();

  reader.onload = function(){

    const result = reader.result;

    selectedImage =
      result.split(",")[1];

    const preview =
      document.getElementById("preview");

    preview.src = result;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

}


/* ==================================================
   SOLVE
   ================================================== */

async function solve(){

  if(busy) return;

  const input =
    document.getElementById("question");

  const question =
    input.value.trim();

  if(!question && !selectedImage){

    alert("Question लेख्नुहोस् वा photo upload गर्नुहोस्।");

    return;

  }


  if(
    API_KEY === "YOUR_GEMINI_API_KEY" ||
    !API_KEY
  ){

    showError(
      "Gemini API key राखिएको छैन। Code मा API key राख्नुहोस्।"
    );

    return;

  }


  busy = true;

  document.getElementById("send").disabled = true;

  document.getElementById("hero")?.remove();


  const finalQuestion =
    question ||
    "यो photo मा भएको question solve गर्नुहोस्।";


  addMessage(
    finalQuestion,
    "user"
  );


  input.value = "";

  input.style.height = "auto";


  const loading =
    showLoading();


  try{

    const answer =
      await askGemini(
        finalQuestion
      );

    loading.remove();

    addMessage(
      answer,
      "ai"
    );

  }
  catch(error){

    loading.remove();

    showError(
      error.message
    );

  }


  busy = false;

  document.getElementById("send").disabled = false;

}


/* ==================================================
   GEMINI
   ================================================== */

async function askGemini(question){

  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/"
    + MODEL +
    ":generateContent?key=" +
    encodeURIComponent(API_KEY);


  const instruction = `
You are an expert AI Question Solver and personal tutor.

Subject:
${subject}

User question:
${question}

Solve the question accurately.

Important rules:

1. Answer in the same language as the user whenever possible.
2. If user uses Nepali, answer in Nepali.
3. If user uses Hindi, answer in Hindi.
4. If user uses English, answer in English.
5. For Mathematics, show step-by-step calculations.
6. For Physics, show formula, values, calculation and final answer.
7. For Chemistry, explain reactions and equations clearly.
8. For Biology, explain concepts simply.
9. For English/Hindi grammar, explain the correction.
10. If an image is provided, read the question from the image.
11. Do not make up an answer.
12. Keep the answer easy for students to understand.
13. Put the final answer clearly at the end.
`;


  const parts = [

    {
      text: instruction
    }

  ];


  if(selectedImage){

    parts.push({

      inlineData:{
        mimeType:selectedMime,
        data:selectedImage
      }

    });

  }


  const body = {

    contents:[
      {
        role:"user",
        parts:parts
      }
    ],

    generationConfig:{
      temperature:0.2,
      maxOutputTokens:4096
    }

  };


  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:
        JSON.stringify(body)
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Gemini API error."
    );

  }


  const answer =
    data.candidates?.[0]
      ?.content?.parts
      ?.map(x => x.text || "")
      .join("");


  if(!answer){

    throw new Error(
      "AI ले answer दिएन। फेरि try गर्नुहोस्।"
    );

  }


  return answer;

}


/* ==================================================
   MESSAGE
   ================================================== */

function addMessage(text,type){

  const chat =
    document.getElementById("chat");


  const box =
    document.createElement("div");

  box.className =
    "message";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar " +
    (type === "user" ? "user" : "ai");

  avatar.textContent =
    type === "user" ? "U" : "AI";


  const content =
    document.createElement("div");

  content.className =
    "content";


  const name =
    document.createElement("div");

  name.className =
    "name";

  name.textContent =
    type === "user"
    ? "You"
    : "AI Question Solver";


  const textBox =
    document.createElement("div");

  textBox.className =
    "text";

  textBox.textContent =
    text;


  content.appendChild(name);

  content.appendChild(textBox);


  if(type === "ai"){

    const copy =
      document.createElement("button");

    copy.className =
      "copy";

    copy.textContent =
      "📋 Copy Answer";

    copy.onclick =
      async function(){

        await navigator.clipboard
          .writeText(text);

        copy.textContent =
          "✓ Copied";

        setTimeout(
          () => {
            copy.textContent =
              "📋 Copy Answer";
          },
          1500
        );

      };

    content.appendChild(copy);

  }


  box.appendChild(avatar);

  box.appendChild(content);

  chat.appendChild(box);


  box.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* ==================================================
   LOADING
   ================================================== */

function showLoading(){

  const chat =
    document.getElementById("chat");


  const box =
    document.createElement("div");

  box.className =
    "message";


  box.innerHTML = `

    <div class="avatar ai">
      AI
    </div>

    <div class="content">

      <div class="name">
        AI Question Solver
      </div>

      <div class="loading">

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

      </div>

    </div>

  `;


  chat.appendChild(box);


  box.scrollIntoView({
    behavior:"smooth"
  });


  return box;

}


/* ==================================================
   ERROR
   ================================================== */

function showError(message){

  const chat =
    document.getElementById("chat");


  const error =
    document.createElement("div");

  error.className =
    "error";

  error.textContent =
    "⚠️ " + message;


  chat.appendChild(error);


  error.scrollIntoView({
    behavior:"smooth"
  });

}


/* ==================================================
   NEW CHAT
   ================================================== */

function newChat(){

  document.getElementById("chat")
    .innerHTML = "";

  subject = "General";

  selectedImage = null;

  selectedMime = null;

  document.getElementById("preview")
    .style.display = "none";

  document.getElementById("imageInput")
    .value = "";

}


/* ==================================================
   ENTER
   ================================================== */

function enterSend(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    solve();

  }

}

</script>

</body>
</html>
