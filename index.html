<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Ome TV 4</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

/* =========================
   SPLASH SCREEN
========================= */

#splash{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    transition:opacity .7s ease;
}

.ometv-logo{
    width:250px;
    height:180px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* TV BODY */

.tv{
    width:245px;
    height:155px;
    background:#fff;
    border:16px solid #ed6539;
    border-radius:32px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.tv::before{
    content:"";
    position:absolute;
    width:13px;
    height:13px;
    background:#ed6539;
    border-radius:50%;
    right:-2px;
    top:50%;
    transform:translateY(-50%);
    box-shadow:0 30px 0 #ed6539;
}

.ome-text{
    font-size:57px;
    font-weight:500;
    color:#ed6539;
    line-height:1;
}

.tv-text{
    position:absolute;
    font-size:42px;
    font-weight:bold;
    color:#38a66b;
    top:76px;
    left:73px;
}

/* ANTENNA */

.antenna-left,
.antenna-right{
    position:absolute;
    width:11px;
    height:60px;
    background:#ed6539;
    border-radius:8px;
    top:-35px;
}

.antenna-left{
    transform:rotate(-43deg);
    left:94px;
}

.antenna-right{
    transform:rotate(43deg);
    left:145px;
}

/* LOADING */

.loading-text{
    margin-top:35px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#333;
    font-size:22px;
}

.green-dot{
    width:16px;
    height:16px;
    background:#6cff00;
    border-radius:50%;
    box-shadow:0 0 8px #6cff00;
}

/* =========================
   APP
========================= */

#app{
    position:fixed;
    inset:0;
    display:none;
    background:#111;
    color:white;
}

/* CAMERA */

#remoteVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#202020;
}

#localVideo{
    position:absolute;
    right:15px;
    top:15px;
    width:115px;
    height:165px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.7);
    background:#222;
    z-index:10;
}

/* DARK OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        transparent 35%,
        transparent 60%,
        rgba(0,0,0,.65)
      );
    pointer-events:none;
}

/* LOGO */

.logo-area{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    text-align:center;
}

.logo-area img{
    width:145px;
    max-height:145px;
    object-fit:contain;
}

/* FALLBACK LOGO */

.logo-fallback{
    width:125px;
    height:125px;
    border-radius:50%;
    background:#081733;
    border:4px solid #2ecbff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:20px;
}

/* CONNECTING */

.connecting{
    position:absolute;
    top:250px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:25px;
    text-shadow:0 2px 5px #000;
}

.connect-dot{
    width:18px;
    height:18px;
    background:#6cff00;
    border-radius:50%;
    box-shadow:0 0 10px #6cff00;
}

/* CONTROLS */

.controls{
    position:absolute;
    left:15px;
    right:15px;
    bottom:105px;
    display:flex;
    gap:10px;
    z-index:30;
}

.control{
    flex:1;
    min-height:62px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:12px;
    background:rgba(20,20,20,.55);
    color:white;
    font-size:16px;
    font-weight:bold;
    backdrop-filter:blur(8px);
}

.control:active{
    transform:scale(.97);
}

/* SAFETY */

.safety{
    position:absolute;
    left:15px;
    right:15px;
    bottom:58px;
    z-index:20;
    font-size:13px;
    line-height:1.4;
    text-shadow:0 1px 3px #000;
}

.safety b{
    color:#ffd000;
}

/* BOTTOM */

.bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:52px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(0,0,0,.55);
    z-index:30;
    font-size:26px;
}

.bottom button{
    background:none;
    border:none;
    color:white;
    font-size:25px;
}

/* START SCREEN */

#startScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:50;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    text-align:center;
}

#startScreen h2{
    font-size:28px;
    margin-bottom:10px;
}

#startScreen p{
    color:#ddd;
    margin-bottom:25px;
}

.start-btn{
    width:90%;
    max-width:350px;
    padding:17px;
    border:0;
    border-radius:14px;
    background:#00d26a;
    color:white;
    font-size:19px;
    font-weight:bold;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:380px;
    background:white;
    color:#222;
    border-radius:18px;
    padding:22px;
}

.modal-box h3{
    margin-bottom:18px;
}

.select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:15px;
    font-size:16px;
}

.modal-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-weight:bold;
}

.close{
    margin-top:10px;
    background:#ddd;
    color:#222;
}

/* MOBILE */

@media(max-width:500px){

    .ometv-logo{
        transform:scale(.82);
    }

    .loading-text{
        font-size:20px;
    }

    .connecting{
        top:245px;
        font-size:23px;
    }

    #localVideo{
        width:100px;
        height:145px;
    }

    .control{
        font-size:14px;
    }

}

</style>
</head>


<body>


<!-- =================================
     SPLASH
================================= -->

<div id="splash">

    <div class="ometv-logo">

        <div class="antenna-left"></div>
        <div class="antenna-right"></div>

        <div class="tv">

            <div class="ome-text">
                Ome
            </div>

            <div class="tv-text">
                TV
            </div>

        </div>

    </div>

    <div class="loading-text">

        <span class="green-dot"></span>

        <span>Connecting...</span>

    </div>

</div>


<!-- =================================
     APP
================================= -->

<div id="app">

    <!-- REMOTE CAMERA -->

    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>


    <!-- LOCAL CAMERA -->

    <video
        id="localVideo"
        autoplay
        muted
        playsinline>
    </video>


    <div class="overlay"></div>


    <!-- NEPALI CHAT LOGO -->

    <div class="logo-area">

        <img
            src="nepali-chat.png"
            alt="Nepali Chat"
            onerror="this.style.display='none';document.getElementById('fallback').style.display='flex';">

        <div
            id="fallback"
            class="logo-fallback"
            style="display:none;">
            Nepali<br>Chat
        </div>

    </div>


    <!-- CONNECTING -->

    <div class="connecting">

        <span class="connect-dot"></span>

        <span id="connectText">
            Connecting...
        </span>

    </div>


    <!-- START SCREEN -->

    <div id="startScreen">

        <h2>
            🇳🇵 Nepali Chat
        </h2>

        <p>
            Connect with people through video chat
        </p>

        <button
            class="start-btn"
            onclick="startCamera()">

            📹 Start Video Chat

        </button>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control"
            onclick="openPerson()">

            I AM 👤

        </button>

        <button
            class="control"
            onclick="openCountry()">

            🇳🇵 NEPAL

        </button>

    </div>


    <!-- SAFETY -->

    <div class="safety">

        <b>⚠ Safety Reminder</b>
        <br>

        By using this video chat, you agree to our rules.
        Keep your face visible in camera frame.

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <button onclick="nextPerson()">
            🔄
        </button>

        <button onclick="reaction('😂')">
            😂
        </button>

        <button onclick="reaction('❤️')">
            ❤️
        </button>

        <button onclick="reaction('👍')">
            👍
        </button>

        <button onclick="reaction('😊')">
            😊
        </button>

        <button onclick="openChat()">
            💬
        </button>

    </div>

</div>


<!-- =================================
     PERSON MODAL
================================= -->

<div
    class="modal"
    id="personModal">

    <div class="modal-box">

        <h3>
            I AM
        </h3>

        <select
            class="select"
            id="gender">

            <option value="male">
                👨 Male
            </option>

            <option value="female">
                👩 Female
            </option>

            <option value="other">
                👤 Other
            </option>

        </select>

        <button
            class="modal-btn"
            onclick="savePerson()">

            Save

        </button>

        <button
            class="modal-btn close"
            onclick="closePerson()">

            Cancel

        </button>

    </div>

</div>


<!-- =================================
     COUNTRY MODAL
================================= -->

<div
    class="modal"
    id="countryModal">

    <div class="modal-box">

        <h3>
            🌍 Select Country
        </h3>

        <select
            class="select"
            id="country">

            <option value="NP">
                🇳🇵 Nepal
            </option>

            <option value="IN">
                🇮🇳 India
            </option>

            <option value="BD">
                🇧🇩 Bangladesh
            </option>

            <option value="US">
                🇺🇸 USA
            </option>

            <option value="GB">
                🇬🇧 United Kingdom
            </option>

            <option value="ALL">
                🌍 Worldwide
            </option>

        </select>

        <button
            class="modal-btn"
            onclick="saveCountry()">

            Select

        </button>

        <button
            class="modal-btn close"
            onclick="closeCountry()">

            Cancel

        </button>

    </div>

</div>


<script>

/* =================================
   SPLASH
================================= */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){

                const splash =
                    document.getElementById(
                        "splash"
                    );

                splash.style.opacity="0";

                setTimeout(
                    function(){

                        splash.style.display="none";

                        document.getElementById(
                            "app"
                        ).style.display="block";

                    },
                    700
                );

            },
            2200
        );

    }
);


/* =================================
   CAMERA
================================= */

let localStream = null;


async function startCamera(){

    try{

        localStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:true

            });


        document.getElementById(
            "localVideo"
        ).srcObject =
            localStream;


        document.getElementById(
            "startScreen"
        ).style.display="none";


        document.getElementById(
            "connectText"
        ).textContent =
            "Waiting for partner...";


    }
    catch(error){

        console.error(error);

        alert(
            "Camera permission denied.\n\n" +
            "Please allow Camera and Microphone permission, " +
            "then reload the page."
        );

    }

}


/* =================================
   NEXT
================================= */

function nextPerson(){

    document.getElementById(
        "connectText"
    ).textContent =
        "Finding someone...";

    setTimeout(
        function(){

            document.getElementById(
                "connectText"
            ).textContent =
                "Waiting for partner...";

        },
        1500
    );

}


/* =================================
   PERSON
================================= */

function openPerson(){

    document.getElementById(
        "personModal"
    ).style.display="flex";

}

function closePerson(){

    document.getElementById(
        "personModal"
    ).style.display="none";

}

function savePerson(){

    const value =
        document.getElementById(
            "gender"
        ).value;

    localStorage.setItem(
        "gender",
        value
    );

    closePerson();

}


/* =================================
   COUNTRY
================================= */

function openCountry(){

    document.getElementById(
        "countryModal"
    ).style.display="flex";

}

function closeCountry(){

    document.getElementById(
        "countryModal"
    ).style.display="none";

}

function saveCountry(){

    const country =
        document.getElementById(
            "country"
        );

    const text =
        country.options[
            country.selectedIndex
        ].text;

    document.querySelector(
        ".control:nth-child(2)"
    ).textContent =
        text;

    localStorage.setItem(
        "country",
        country.value
    );

    closeCountry();

}


/* =================================
   REACTION
================================= */

function reaction(emoji){

    console.log(
        "Reaction:",
        emoji
    );

}


/* =================================
   CHAT
================================= */

function openChat(){

    alert(
        "Chat will be available after connecting with a partner."
    );

}


/* =================================
   STOP CAMERA WHEN PAGE CLOSES
================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

        }

    }
);

</script>

</body>
</html>
