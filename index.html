<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Question Solver</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:7px;
  font-size:14px;
  opacity:.9;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* API */

.api-box{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.api-box h3{
  margin-bottom:10px;
}

.api-row{
  display:flex;
  gap:8px;
}

.api-row input{
  flex:1;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

.api-row button{
  background:#4f46e5;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
}

.api-status{
  margin-top:9px;
  font-size:13px;
}

/* SUBJECT */

.subjects{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
  padding-bottom:5px;
}

.subject{
  border:none;
  background:white;
  padding:10px 15px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.subject.active{
  background:#4f46e5;
  color:white;
}

/* CHAT */

.chat{
  background:white;
  min-height:430px;
  max-height:60vh;
  overflow-y:auto;
  padding:15px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.welcome{
  text-align:center;
  padding:70px 20px;
  color:#6b7280;
}

.welcome-icon{
  font-size:55px;
  margin-bottom:15px;
}

.message{
  display:flex;
  margin:12px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:88%;
  padding:13px 15px;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#4f46e5;
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:#eef2ff;
  color:#111827;
  border-bottom-left-radius:4px;
}

/* INPUT */

.input-box{
  margin-top:15px;
  background:white;
  padding:12px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

textarea{
  width:100%;
  min-height:90px;
  border:1px solid #d1d5db;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  resize:none;
  outline:none;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

.subject-name{
  color:#6b7280;
  font-size:14px;
}

.solve{
  background:#16a34a;
  color:white;
  border:none;
  padding:13px 22px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.new-chat{
  margin-top:10px;
  width:100%;
  background:#ef4444;
  color:white;
  border:none;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
}

/* LOADING */

.loading{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:8px;
  height:8px;
  background:#4f46e5;
  border-radius:50%;
  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* MOBILE */

@media(max-width:600px){

  .api-row{
    flex-direction:column;
  }

  .api-row button{
    width:100%;
  }

  .actions{
    flex-direction:column;
    align-items:stretch;
  }

  .subject-name{
    text-align:center;
  }

  .solve{
    width:100%;
  }

  .bubble{
    max-width:94%;
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 AI Question Solver</h1>
  <p>Math • Physics • Chemistry • Biology • English • Hindi</p>
</header>


<div class="container">

  <!-- API KEY -->

  <div class="api-box">

    <h3>🔑 Gemini API Key</h3>

    <div class="api-row">

      <input
        type="password"
        id="apiKey"
        placeholder="Paste Gemini API key (AIza...)"
      >

      <button onclick="saveKey()">
        Save Key
      </button>

    </div>

    <div
      class="api-status"
      id="apiStatus">
    </div>

  </div>


  <!-- SUBJECTS -->

  <div class="subjects">

    <button
      class="subject active"
      onclick="chooseSubject('General',this)">
      🤖 General
    </button>

    <button
      class="subject"
      onclick="chooseSubject('Math',this)">
      🧮 Math
    </button>

    <button
      class="subject"
      onclick="chooseSubject('Physics',this)">
      ⚡ Physics
    </button>

    <button
      class="subject"
      onclick="chooseSubject('Chemistry',this)">
      🧪 Chemistry
    </button>

    <button
      class="subject"
      onclick="chooseSubject('Biology',this)">
      🧬 Biology
    </button>

    <button
      class="subject"
      onclick="chooseSubject('English',this)">
      🇬🇧 English
    </button>

    <button
      class="subject"
      onclick="chooseSubject('Hindi',this)">
      🇮🇳 Hindi
    </button>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat">

    <div
      class="welcome"
      id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h2>
        AI Question Solver
      </h2>

      <p style="margin-top:10px">
        आफ्नो question लेख्नुहोस्।
      </p>

      <p style="margin-top:7px">
        म step-by-step solution दिनेछु।
      </p>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-box">

    <textarea
      id="question"
      placeholder="Write your question here..."
      onkeydown="enterToSend(event)">
    </textarea>

    <div class="actions">

      <div class="subject-name">
        Subject:
        <b id="currentSubject">
          General
        </b>
      </div>

      <button
        class="solve"
        onclick="solveQuestion()">
        🚀 Solve Question
      </button>

    </div>

    <button
      class="new-chat"
      onclick="newChat()">
      🗑️ New Chat
    </button>

  </div>

</div>


<script>

/* ==================================================
   GEMINI SETTINGS
================================================== */

const MODEL =
  "gemini-3.8-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  + MODEL
  + ":generateContent";


/* ==================================================
   VARIABLES
================================================== */

let apiKey =
  localStorage.getItem("gemini_api_key") || "";

let currentSubject =
  "General";


/* ==================================================
   LOAD
================================================== */

window.addEventListener("load",function(){

  if(apiKey){

    document.getElementById("apiKey").value =
      apiKey;

    document.getElementById("apiStatus").textContent =
      "✅ API key saved on this device.";

    document.getElementById("apiStatus").style.color =
      "#16a34a";
  }

});


/* ==================================================
   SAVE KEY
================================================== */

function saveKey(){

  const key =
    document.getElementById("apiKey")
    .value
    .trim();

  if(!key){

    alert(
      "Please paste your Gemini API key."
    );

    return;
  }

  if(!key.startsWith("AIza")){

    alert(
      "Invalid Gemini API key format.\n\n" +
      "Gemini API keys normally start with AIza."
    );

    return;
  }

  apiKey = key;

  localStorage.setItem(
    "gemini_api_key",
    apiKey
  );

  document.getElementById("apiStatus").textContent =
    "✅ API key saved successfully.";

  document.getElementById("apiStatus").style.color =
    "#16a34a";

}


/* ==================================================
   SUBJECT
================================================== */

function chooseSubject(subject,button){

  currentSubject =
    subject;

  document.getElementById(
    "currentSubject"
  ).textContent =
    subject;

  document.querySelectorAll(
    ".subject"
  ).forEach(function(btn){

    btn.classList.remove("active");

  });

  button.classList.add("active");

}


/* ==================================================
   ENTER
================================================== */

function enterToSend(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    solveQuestion();

  }

}


/* ==================================================
   ADD MESSAGE
================================================== */

function addMessage(type,text){

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );

  chat.scrollTop =
    chat.scrollHeight;

}


/* ==================================================
   LOADING
================================================== */

function showLoading(){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "loading";

  message.innerHTML = `

    <div class="bubble loading">

      <span>AI सोच्दैछ</span>

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;

  chat.appendChild(
    message
  );

  chat.scrollTop =
    chat.scrollHeight;

}


function hideLoading(){

  const loading =
    document.getElementById("loading");

  if(loading){
    loading.remove();
  }

}


/* ==================================================
   SOLVE
================================================== */

async function solveQuestion(){

  const question =
    document.getElementById(
      "question"
    ).value.trim();


  /* KEY CHECK */

  if(!apiKey){

    alert(
      "पहिले Gemini API Key paste गरेर Save Key थिच्नुहोस्।"
    );

    return;
  }


  /* QUESTION CHECK */

  if(!question){

    alert(
      "Please write your question first."
    );

    return;
  }


  /* USER */

  addMessage(
    "user",
    question
  );


  document.getElementById(
    "question"
  ).value = "";


  showLoading();


  /* PROMPT */

  const prompt = `

You are an expert AI student tutor.

Subject:
${currentSubject}

User question:
${question}

Give the most accurate answer.

Rules:

- Explain clearly and simply.
- Give step-by-step solution.
- For Math, show formulas and calculations.
- For Physics, show formula, values, units and final answer.
- For Chemistry, explain equations, reactions and concepts.
- For Biology, explain concepts in simple language.
- For English, correct grammar and explain the correction.
- For Hindi, answer naturally in Hindi.
- If the user asks in Nepali, you can answer in Nepali.
- Do not make up information.
- If the question is unclear, say what information is missing.
- Make the answer easy for a student to understand.

Answer the question now.

`;


  /* REQUEST */

  const requestBody = {

    contents:[

      {
        role:"user",

        parts:[
          {
            text:prompt
          }
        ]

      }

    ],

    generationConfig:{

      temperature:0.2,

      maxOutputTokens:4096

    }

  };


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey
          },

          body:
            JSON.stringify(
              requestBody
            )
        }
      );


    const data =
      await response.json();


    hideLoading();


    /* ERROR */

    if(!response.ok){

      console.error(
        "Gemini API Error:",
        data
      );

      let errorText =
        "API request failed.";

      if(
        data &&
        data.error &&
        data.error.message
      ){

        errorText =
          data.error.message;

      }


      addMessage(
        "ai",
        "❌ Gemini API Error\n\n" +
        errorText +
        "\n\nHTTP Status: " +
        response.status
      );

      return;

    }


    /* GET ANSWER */

    let answer = "";


    if(
      data.candidates &&
      data.candidates.length > 0
    ){

      const candidate =
        data.candidates[0];


      if(
        candidate.content &&
        candidate.content.parts
      ){

        candidate.content.parts.forEach(
          function(part){

            if(part.text){

              answer +=
                part.text;

            }

          }
        );

      }

    }


    /* EMPTY */

    if(!answer){

      answer =
        "AI ले कुनै answer पठाएन। कृपया फेरि try गर्नुहोस्।";

    }


    addMessage(
      "ai",
      answer
    );


  }
  catch(error){

    console.error(
      "Network error:",
      error
    );

    hideLoading();


    addMessage(
      "ai",

      "❌ Network Error\n\n" +
      "Internet connection check गर्नुहोस्.\n\n" +
      error.message
    );

  }

}


/* ==================================================
   NEW CHAT
================================================== */

function newChat(){

  document.getElementById(
    "chat"
  ).innerHTML = `

    <div
      class="welcome"
      id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h2>
        AI Question Solver
      </h2>

      <p style="margin-top:10px">
        आफ्नो question लेख्नुहोस्।
      </p>

      <p style="margin-top:7px">
        म step-by-step solution दिनेछु।
      </p>

    </div>

  `;

}

</script>

</body>
</html>
