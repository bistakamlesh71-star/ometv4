<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Question Solver</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

.header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.header h1{
  font-size:25px;
}

.header p{
  margin-top:6px;
  opacity:.9;
  font-size:14px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* API BOX */

.api-box{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.api-title{
  font-weight:bold;
  margin-bottom:10px;
}

.api-row{
  display:flex;
  gap:8px;
}

.api-row input{
  flex:1;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  cursor:pointer;
}

.save-btn{
  background:#4f46e5;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold;
}

.status{
  margin-top:8px;
  font-size:13px;
  color:#16a34a;
}

/* SUBJECTS */

.subjects{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:15px;
}

.subject{
  white-space:nowrap;
  padding:10px 15px;
  background:white;
  border-radius:20px;
  border:1px solid #ddd;
  cursor:pointer;
  font-size:14px;
}

.subject.active{
  background:#4f46e5;
  color:white;
  border-color:#4f46e5;
}

/* CHAT */

.chat{
  background:white;
  min-height:430px;
  max-height:58vh;
  overflow-y:auto;
  padding:15px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.welcome{
  text-align:center;
  padding:50px 20px;
  color:#667085;
}

.welcome .emoji{
  font-size:50px;
  margin-bottom:15px;
}

.message{
  display:flex;
  margin:12px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:15px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user .bubble{
  background:#4f46e5;
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:#eef2ff;
  color:#172033;
  border-bottom-left-radius:4px;
}

/* INPUT */

.input-area{
  background:white;
  margin-top:15px;
  padding:12px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

textarea{
  width:100%;
  min-height:80px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  outline:none;
}

.bottom-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  gap:10px;
}

.selected{
  color:#667085;
  font-size:13px;
}

.send-btn{
  background:#4f46e5;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
}

.new-btn{
  background:#ef4444;
  color:white;
  padding:12px 15px;
  border-radius:10px;
  margin-top:10px;
}

/* LOADING */

.loading{
  display:flex;
  align-items:center;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  background:#4f46e5;
  border-radius:50%;
  animation:blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* MOBILE */

@media(max-width:600px){

  .header h1{
    font-size:21px;
  }

  .container{
    padding:10px;
  }

  .api-row{
    flex-direction:column;
  }

  .save-btn{
    width:100%;
  }

  .chat{
    min-height:400px;
  }

  .bubble{
    max-width:92%;
  }

  .bottom-row{
    flex-direction:column;
    align-items:stretch;
  }

  .send-btn{
    width:100%;
  }

  .selected{
    text-align:center;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>🤖 AI Question Solver</h1>
  <p>Math • Physics • Chemistry • Biology • English • Hindi</p>
</header>

<div class="container">

  <!-- API KEY -->
  <div class="api-box">

    <div class="api-title">
      🔑 Gemini API Key
    </div>

    <div class="api-row">

      <input
        type="password"
        id="apiKey"
        placeholder="Paste your Gemini API key here"
      >

      <button class="save-btn" onclick="saveApiKey()">
        Save API Key
      </button>

    </div>

    <div class="status" id="apiStatus"></div>

  </div>


  <!-- SUBJECTS -->

  <div class="subjects">

    <button class="subject active" onclick="selectSubject('General',this)">
      🤖 General
    </button>

    <button class="subject" onclick="selectSubject('Math',this)">
      🧮 Math
    </button>

    <button class="subject" onclick="selectSubject('Physics',this)">
      ⚡ Physics
    </button>

    <button class="subject" onclick="selectSubject('Chemistry',this)">
      🧪 Chemistry
    </button>

    <button class="subject" onclick="selectSubject('Biology',this)">
      🧬 Biology
    </button>

    <button class="subject" onclick="selectSubject('English',this)">
      🇬🇧 English
    </button>

    <button class="subject" onclick="selectSubject('Hindi',this)">
      🇮🇳 Hindi
    </button>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="welcome" id="welcome">

      <div class="emoji">🤖</div>

      <h2>Ask me anything!</h2>

      <p style="margin-top:10px">
        आफ्नो question लेख्नुहोस्।
      </p>

      <p style="margin-top:8px">
        म step-by-step solution दिनेछु।
      </p>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <textarea
      id="question"
      placeholder="Write your question here..."
      onkeydown="handleEnter(event)"
    ></textarea>

    <div class="bottom-row">

      <div class="selected">
        Subject: <b id="selectedSubject">General</b>
      </div>

      <button class="send-btn" onclick="sendQuestion()">
        🚀 Solve
      </button>

    </div>

    <button class="new-btn" onclick="newChat()">
      🗑️ New Chat
    </button>

  </div>

</div>


<script>

/* =====================================================
   GEMINI CONFIG
===================================================== */

const MODEL = "gemini-3.8-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/interactions";


/* =====================================================
   VARIABLES
===================================================== */

let API_KEY =
  localStorage.getItem("gemini_api_key") || "";

let selectedSubject = "General";

let previousInteractionId =
  localStorage.getItem("previous_interaction_id") || "";


/* =====================================================
   PAGE LOAD
===================================================== */

window.onload = function(){

  const input = document.getElementById("apiKey");

  if(API_KEY){
    input.value = API_KEY;

    document.getElementById("apiStatus").textContent =
      "✅ API key saved on this device.";
  }

};


/* =====================================================
   SAVE API KEY
===================================================== */

function saveApiKey(){

  const key =
    document.getElementById("apiKey").value.trim();

  if(!key){

    alert("Please paste your Gemini API key.");

    return;
  }

  if(!key.startsWith("AIza")){

    alert(
      "This does not look like a Gemini API key. " +
      "Google Gemini keys normally start with AIza."
    );

    return;
  }

  API_KEY = key;

  localStorage.setItem(
    "gemini_api_key",
    API_KEY
  );

  document.getElementById("apiStatus").textContent =
    "✅ API key saved successfully.";

}


/* =====================================================
   SUBJECT
===================================================== */

function selectSubject(subject, button){

  selectedSubject = subject;

  document.getElementById(
    "selectedSubject"
  ).textContent = subject;

  document.querySelectorAll(".subject")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

}


/* =====================================================
   ENTER KEY
===================================================== */

function handleEnter(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendQuestion();

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(type, text){

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;

}


/* =====================================================
   LOADING
===================================================== */

function addLoading(){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  message.id =
    "loadingMessage";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble loading";

  bubble.innerHTML = `
    <span>AI सोच्दैछ</span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   REMOVE LOADING
===================================================== */

function removeLoading(){

  const loading =
    document.getElementById(
      "loadingMessage"
    );

  if(loading){
    loading.remove();
  }

}


/* =====================================================
   SEND QUESTION
===================================================== */

async function sendQuestion(){

  const question =
    document.getElementById(
      "question"
    ).value.trim();


  if(!API_KEY){

    alert(
      "पहिले Gemini API Key paste गरेर Save API Key गर्नुहोस्।"
    );

    return;
  }


  if(!question){

    alert(
      "Please write your question first."
    );

    return;
  }


  /* USER MESSAGE */

  addMessage(
    "user",
    question
  );

  document.getElementById(
    "question"
  ).value = "";


  addLoading();


  try{

    const prompt = `
You are an expert AI Question Solver.

Subject: ${selectedSubject}

Solve the user's question accurately.

User question:
${question}

Instructions:

1. Understand the question carefully.
2. Give the correct answer.
3. Explain step-by-step.
4. For Math, show formulas and calculations.
5. For Physics, show formula, values, units and final answer.
6. For Chemistry, explain reactions, formulas and concepts.
7. For Biology, explain concepts clearly.
8. For English, correct grammar and explain why.
9. For Hindi, answer naturally in Hindi.
10. If the user asks in Nepali, you may answer in Nepali.
11. Keep the answer easy for students to understand.
12. Do not invent facts.
13. If the question is unclear, explain what information is missing.
14. Use plain text formatting that works well on mobile.

Answer now.
`;


    const body = {

      model: MODEL,

      input: prompt,

      generation_config: {

        thinking_level: "medium",

        temperature: 0.2

      }

    };


    /* CONTINUE CHAT */

    if(previousInteractionId){

      body.previous_interaction_id =
        previousInteractionId;

    }


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-goog-api-key":
              API_KEY
          },

          body:
            JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    removeLoading();


    /* ERROR */

    if(!response.ok){

      console.error(data);

      let errorMessage =
        "Something went wrong.";

      if(data.error){

        errorMessage =
          data.error.message ||
          JSON.stringify(data.error);

      }

      addMessage(
        "ai",
        "❌ Error:\n\n" +
        errorMessage
      );

      return;

    }


    /* SAVE INTERACTION ID */

    if(data.id){

      previousInteractionId =
        data.id;

      localStorage.setItem(
        "previous_interaction_id",
        data.id
      );

    }


    /* GET OUTPUT */

    let answer = "";


    if(data.output_text){

      answer =
        data.output_text;

    }
    else if(
      data.output &&
      Array.isArray(data.output)
    ){

      for(
        const item of data.output
      ){

        if(
          item.type === "text" &&
          item.text
        ){

          answer +=
            item.text;

        }

      }

    }


    if(!answer){

      answer =
        "AI ले answer पठाउन सकेन। फेरि try गर्नुहोस्।";

    }


    addMessage(
      "ai",
      answer
    );


  }
  catch(error){

    console.error(error);

    removeLoading();

    addMessage(
      "ai",
      "❌ Internet/API error.\n\n" +
      "Internet connection र API key check गर्नुहोस्."
    );

  }

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  if(
    !confirm(
      "Start a new chat?"
    )
  ){

    return;

  }


  document.getElementById(
    "chat"
  ).innerHTML = `

    <div class="welcome" id="welcome">

      <div class="emoji">🤖</div>

      <h2>New Chat</h2>

      <p style="margin-top:10px">
        आफ्नो question लेख्नुहोस्।
      </p>

    </div>

  `;


  previousInteractionId = "";

  localStorage.removeItem(
    "previous_interaction_id"
  );

}

</script>

</body>
</html>
